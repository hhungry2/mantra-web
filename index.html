<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantra Web Port (Action RPG)</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/ui/cursor.png">
</head>
<body>
  <header>
    <h1>MANTRA</h1>
    <p class="subtitle">Action RPG Web Port (1995 Syzygy Cult)</p>
  </header>

  <main id="game-container">
    <canvas id="game-canvas" width="512" height="344"></canvas>

    <div id="overlay-screen" class="title-screen">
      <img id="overlay-logo" src="assets/ui/mantra.png" alt="MANTRA">
      <p id="overlay-msg" class="title-status" aria-live="polite"></p>
      <div class="title-menu" role="menu" aria-label="Main menu">
        <button id="start-btn" class="title-btn" type="button">New</button>
        <button id="open-btn" class="title-btn" type="button">Open</button>
        <button class="title-btn" type="button" disabled>Save</button>
        <button class="title-btn" type="button" disabled>Resume</button>
      </div>
      <label class="debug-toggle">
        <input id="debug-mode" type="checkbox">
        <span>DEBUG MODE: HP / DASH</span>
      </label>
    </div>

    <div id="story-screen" class="ui-overlay hidden">
      <img src="assets/ui/story.png" alt="Story">
      <button id="story-btn" class="btn">CONTINUE</button>
    </div>
  </main>

  <footer id="controls-guide">
    <div><span class="key-badge">Arrow / WASD</span> 移動</div>
    <div><span class="key-badge">Shift</span> ダッシュ</div>
    <div><span class="key-badge">Space</span> 剣</div>
    <div><span class="key-badge">E</span> 調べる / 会話</div>
    <div><span class="key-badge">I / Tab</span> インベントリ・装備</div>
    <div><span class="key-badge">V</span> セーブ / ロード</div>
    <div><span class="key-badge">M</span> サウンド</div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
