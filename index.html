<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="Mantra Web Port (Action RPG)">Mantra Web Port (Action RPG)</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/ui/cursor.png">
</head>
<body>
  <header>
    <h1>MANTRA</h1>
    <p class="subtitle" data-i18n="Action RPG Web Port (1995 Syzygy Cult)">Action RPG Web Port (1995 Syzygy Cult)</p>
  </header>

  <main id="game-container">
    <canvas id="game-canvas" width="512" height="344"></canvas>

    <div id="overlay-screen" class="title-screen">
      <img id="overlay-logo" src="assets/ui/mantra.png" alt="MANTRA">
      <p id="overlay-msg" class="title-status" aria-live="polite"></p>
      <div class="title-menu" role="menu" aria-label="Main menu" data-i18n-aria-label="Main menu">
        <button id="start-btn" class="title-btn" type="button" data-i18n="New">New</button>
        <button id="open-btn" class="title-btn" type="button" data-i18n="Open">Open</button>
        <button class="title-btn" type="button" disabled data-i18n="Save">Save</button>
        <button class="title-btn" type="button" disabled data-i18n="Resume">Resume</button>
      </div>
      <label class="language-toggle">
        <span data-i18n="Language">Language</span>
        <select id="lang-select" aria-label="Language" data-i18n-aria-label="Language">
          <option value="en" data-i18n="English">English</option>
          <option value="ja" data-i18n="日本語">日本語</option>
        </select>
      </label>
    </div>

    <div id="story-screen" class="ui-overlay hidden">
      <img src="assets/ui/story.png" alt="Story" data-i18n-alt="Story">
      <button id="story-btn" class="btn" data-i18n="CONTINUE">CONTINUE</button>
    </div>

  </main>

  <div class="debug-controls">
    <label class="debug-toggle">
      <input id="debug-mode" type="checkbox">
      <span data-i18n="DEBUG MODE: HP / DASH">DEBUG MODE: HP / DASH</span>
    </label>
    <button id="debug-lvlup-btn" type="button" class="debug-btn" data-i18n="Level Up">Lv UP</button>
    <div class="debug-warp">
      <input id="debug-screen-input" type="number" min="0" max="255" placeholder="0-255" aria-label="画面番号" title="画面番号 (0-255)">
      <button id="debug-warp-btn" type="button" class="debug-btn" data-i18n="Warp">移動</button>
    </div>
    <div id="debug-mantras" class="debug-mantras" title="所持マントラ (クリックで所持切替)">
      <div class="debug-mantra-slot" data-code="100" title="炎のマントラ (Fire Mantra)"></div>
      <div class="debug-mantra-slot" data-code="101" title="地のマントラ (Earth Mantra)"></div>
      <div class="debug-mantra-slot" data-code="102" title="水のマントラ (Water Mantra)"></div>
      <div class="debug-mantra-slot" data-code="103" title="風のマントラ (Air Mantra)"></div>
      <div class="debug-mantra-slot" data-code="104" title="力のマントラ (Force Mantra)"></div>
    </div>
  </div>

  <footer id="controls-guide">
    <div><span class="key-badge">Arrow / WASD</span> 移動</div>
    <div><span class="key-badge">Shift</span> ダッシュ</div>
    <div><span class="key-badge">Space</span> 剣</div>
    <div><span class="key-badge">F</span> 飛び道具</div>
    <div><span class="key-badge">E</span> 調べる / 会話</div>
    <div><span class="key-badge">I / Tab</span> インベントリ・装備</div>
    <div><span class="key-badge">V</span> セーブ / ロード</div>
    <div><span class="key-badge">M</span> サウンド</div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
